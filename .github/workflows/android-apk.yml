name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Import staged source
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .source_chunks ]; then
            : > /tmp/head.b64
            for f in .source_chunks/part{01..16}.txt; do
              tr -d '\r\n' < "$f" | head -c 8000 >> /tmp/head.b64
            done

            {
              for f in .source_chunks/head{01..05}.gz.b64; do
                tr -d '\r\n' < "$f"
              done
              for f in .source_chunks/tail{02..16}.gz.b64; do
                tr -d '\r\n' < "$f"
              done
            } > /tmp/tail.gz.b64

            base64 -d /tmp/tail.gz.b64 > /tmp/tail.gz
            gunzip -c /tmp/tail.gz > /tmp/tail.b64
            cat /tmp/head.b64 /tmp/tail.b64 > /tmp/source.b64
            base64 -d /tmp/source.b64 > /tmp/source.zip

            unzip -tq /tmp/source.zip
            rm -rf /tmp/source-unpack
            mkdir -p /tmp/source-unpack
            unzip -q /tmp/source.zip -d /tmp/source-unpack
            test -f /tmp/source-unpack/kysmindset-main/package.json
            test -f /tmp/source-unpack/kysmindset-main/android/app/build.gradle

            cd /tmp/source-unpack/kysmindset-main
            ACTUAL_MANIFEST=$(find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
            test "$ACTUAL_MANIFEST" = "c562299f4e87c2240248346b06679b57f3e5804f82a2e9a78c7c72e64509ca8a"
            cd "$GITHUB_WORKSPACE"

            rsync -a --exclude='.github/workflows/android-apk.yml' /tmp/source-unpack/kysmindset-main/ ./
            rm -rf .source_chunks node_modules
            sed -i 's#xz64uj777/kymindset2\.-0#xz64uj777/kymindset2.0#g; s#xz64uj777/kysmindset#xz64uj777/kymindset2.0#g' README.md android/app/src/main/java/app/kysmindset/security/AppUpdate.java
            touch /tmp/imported
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Verify security and web code
        run: |
          npm run test
          npm run typecheck
          npm run build

      - name: Embed web build in Android app
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R dist/. android/app/src/main/assets/www/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace --no-daemon

      - name: Normalize repository source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            if [ -f /tmp/imported ]; then
              git commit -m "Import Kymindset 2.0 source and embedded web assets [skip ci]"
            else
              git commit -m "Refresh embedded web assets [skip ci]"
            fi
            git push || echo "Build succeeded; normalized source could not be pushed."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kymindset2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION_CODE=$(sed -n 's/.*versionCode[[:space:]]\+\([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -1)
          VERSION_NAME=$(sed -n 's/.*versionName[[:space:]]\+"\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)
          BUILD_COMMIT=$(git rev-parse HEAD)
          NOTES=$(printf 'Automated APK build from main.\n\nversionCode: %s\nversionName: %s\ncommit: %s\n\nDebug APK for testing.\n' "$VERSION_CODE" "$VERSION_NAME" "$BUILD_COMMIT")

          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --title "Kymindset 2.0 Latest APK" --notes "$NOTES" --latest
            gh release upload apk-latest android/app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create apk-latest android/app/build/outputs/apk/debug/app-debug.apk \
              --title "Kymindset 2.0 Latest APK" \
              --notes "$NOTES" \
              --latest
          fi
