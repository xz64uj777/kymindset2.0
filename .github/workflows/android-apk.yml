name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Align unified scan result contracts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/align_scan_result_contracts.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/security-contract.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Align tests with unified scan results [skip ci]"
            git push origin HEAD:main
          fi

      - name: Validate source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f tests/security-contract.test.mjs
          test -f android/app/build.gradle
          test -f android/app/kymindset-debug.keystore
          test -f android/app/src/main/res/drawable/kys_icon.xml

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Verify security and web code
        run: |
          npm run test
          npm run typecheck
          npm run build

      - name: Embed web build in Android app
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R dist/. android/app/src/main/assets/www/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kymindset2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION_CODE=$(sed -n 's/.*versionCode[[:space:]]\+\([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -1)
          VERSION_NAME=$(sed -n 's/.*versionName[[:space:]]\+"\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)
          BUILD_COMMIT=$(git rev-parse HEAD)
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          NOTES=$(printf 'Kymindset 2.0 hardened test build.\n\nversionCode: %s\nversionName: %s\npackage: app.kysmindset.security.dev\ncommit: %s\nsha256: %s\n\nFlow: Scan → Results → Auto Fix or Manual Review.\n' "$VERSION_CODE" "$VERSION_NAME" "$BUILD_COMMIT" "$APK_SHA")

          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --title "Kymindset 2.0 Latest APK" --notes "$NOTES" --latest
            gh release upload apk-latest "$APK" --clobber
          else
            gh release create apk-latest "$APK" \
              --title "Kymindset 2.0 Latest APK" \
              --notes "$NOTES" \
              --latest
          fi
