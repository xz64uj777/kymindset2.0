name: Build Android APK

on:
  push:
    branches: [main, clean-import]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Import audited source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .bundle4 ]; then
            {
              cat .bundle4/part{01..09}.b64
              cat .bundle4/part10{a,b,c}.b64
              cat .bundle4/part11{a,b,c}.b64
              cat .bundle4/part12{a,b,c}.b64
            } | tr -d '\r\n' > /tmp/source.xz.b64

            base64 -d /tmp/source.xz.b64 > /tmp/source.tar.xz
            echo "14ea02c21753e0b5019ec0e56277ea78810f8f60c773b05876b4e1f657c1d2db  /tmp/source.tar.xz" | sha256sum -c -

            rm -rf /tmp/source-unpack
            mkdir -p /tmp/source-unpack
            tar -xJf /tmp/source.tar.xz -C /tmp/source-unpack
            test -f /tmp/source-unpack/package.json
            test -f /tmp/source-unpack/android/app/build.gradle
            test -f /tmp/source-unpack/tests/security-contracts.test.mjs

            rsync -a --delete \
              --exclude='.git' \
              --exclude='.github/workflows/android-apk.yml' \
              --exclude='.bundle4' \
              /tmp/source-unpack/ ./

            rm -rf .bundle4 .bundle2 .clean_bundle .source_chunks node_modules dist android/app/build
            echo "imported=true" >> "$GITHUB_OUTPUT"
          else
            echo "imported=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Normalize imported source
        if: steps.source.outputs.imported == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import audited Kymindset 2.0 source [skip ci]"
            git push
          fi

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify security and web code
        run: |
          npm run test
          npm run typecheck
          npm run build

      - name: Embed web build in Android app
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R dist/. android/app/src/main/assets/www/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set CI version
        shell: bash
        run: |
          echo "KYS_VERSION_CODE=$((20000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "KYS_VERSION_NAME=2.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kymindset2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          BUILD_COMMIT=$(git rev-parse HEAD)
          NOTES=$(printf 'Kymindset 2.0 audited development build.\n\nversionCode: %s\nversionName: %s\npackage: app.kysmindset.security.dev\nsha256: %s\ncommit: %s\n\nMindset: Observe → Verify → Control → Recover.\n' "$KYS_VERSION_CODE" "$KYS_VERSION_NAME" "$APK_SHA" "$BUILD_COMMIT")

          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --title "Kymindset 2.0 Latest APK" --notes "$NOTES" --latest
            gh release upload apk-latest "$APK" --clobber
          else
            gh release create apk-latest "$APK" \
              --title "Kymindset 2.0 Latest APK" \
              --notes "$NOTES" \
              --latest
          fi
